<div class="login-container">
      <div class="login-card slide-in-up">
        <div class="card glass">
          <div class="card-header text-center">
            <div class="login-icon">
              <i class="now-ui-icons ui-1_lock-circle-open"></i>
            </div>
            <h2 class="card-title text-title-contrast">Iniciar Sesión</h2>
            <p class="login-subtitle text-high-contrast">Accede a tu cuenta para continuar tener acceso completo</p>
          </div>
          
          <div class="card-body">
            <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
              <div class="form-group">
                <label for="email" class="form-label">
                  <span class="label-icon">
                    <i class="now-ui-icons users_single-02"></i>
                  </span>
                  Email
                </label>
                <input 
                  type="text" 
                  id="email"
                  class="form-control" 
                  [(ngModel)]="loginData.email"
                  name="Coerreo"
                  required
                  #email="ngModel"
                  [class.is-invalid]="email.invalid && email.touched"
                >
                <div class="invalid-feedback" *ngIf="email.invalid && email.touched">
                  <div *ngIf="email.errors?.['required']">El correo es requerido</div>
                </div>
              </div>

              <div class="form-group">
                <label for="password" class="form-label">
                  <span class="label-icon">
                    <i class="now-ui-icons ui-1_lock-circle-open"></i>
                  </span>
                  Contraseña
                </label>
                <input 
                  type="password" 
                  id="password"
                  class="form-control" 
                  [(ngModel)]="loginData.contrasena"
                  name="contrasena"
                  required
                  minlength="4"
                  #password="ngModel"
                  [class.is-invalid]="password.invalid && password.touched"
                >
                <div class="invalid-feedback" *ngIf="password.invalid && password.touched">
                  <div *ngIf="password.errors?.['required']">La contraseña es requerida</div>
                  <div *ngIf="password.errors?.['minlength']">La contraseña debe tener al menos 4 caracteres</div>
                </div>
              </div>

              <div class="form-group">
                <button 
                  type="submit" 
                  class="btn btn-primary w-100 btn-lg"
                  [disabled]="loginForm.invalid || loading"
                  [class.loading]="loading"
                >
                  <span *ngIf="loading" class="spinner"></span>
                  <span *ngIf="loading">Iniciando sesión...</span>
                  <span *ngIf="!loading">
                    <span class="btn-icon">
                      <i class="now-ui-icons arrows-1_cloud-upload-94"></i>
                    </span>
                    Iniciar Sesión
                  </span>
                </button>
              </div>

              <div class="form-options">
                <div class="text-center">
                  <a routerLink="/auth/forgot-password" class="link">
                    <span class="link-icon">
                      <i class="now-ui-icons ui-1_lock-circle-open"></i>
                    </span>
                    ¿Olvidaste tu contraseña?
                  </a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
